version: '3.7'

services:
  alesap:
    image: davidsiaw/alesap-server
    deploy:
      update_config:
        order: stop-first
    environment:
      LETSENCRYPT_HOST: api.alesap.astrobunny.net
      VIRTUAL_HOST: api.alesap.astrobunny.net
      VIRTUAL_PORT: 3000
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${ALESAP_MASTER_KEY}
      ALLOWED_ORIGINS: alesap.astrobunny.net,alesap.blankaex.reisen,192.168.1.4:4567
      DATABASE_URL: ${ALESAP_DB_URL}
      THING: 1
      # Song data, downloaded and imported on every start (docs/deploy.md).
      TBLDUMP_URL: http://alesap-tbldump:8080/tbldump.tar.gz
      WORKERS: 4 # i7-6700K, shared with the app and Postgres
    container_name: alesap
    networks:
      - alesap

  # Serves tbldump.tar.gz on :8080 to the alesap service. Internal only: no ports, no VIRTUAL_HOST.
  # Pulled from the GitLab registry; the registry login lives in Portainer (Registries), not here.
  alesap-tbldump:
    image: docker-registry.astrobunny.net/labs/alesap-data2:latest
    deploy:
      update_config:
        order: stop-first
    networks:
      - alesap

  alesap-db:
    image: postgres:17
    deploy:
      update_config:
        order: stop-first
    environment:
      POSTGRES_PASSWORD: ${ALESAP_PG_PASS}
      POSTGRES_USER: ${ALESAP_PG_USER}
      POSTGRES_DB: ${ALESAP_PG_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    container_name: alesap-db
    volumes:
      - alesap-data:/var/lib/postgresql/data
      - postgres-config:/etc/postgresql
    networks:
      - alesap
    ports:
      - 5432
    sysctls:
        - net.ipv6.conf.all.disable_ipv6=1
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf';
volumes:
  alesap-data:
    external: true
  postgres-config:
    external: true

networks:
  alesap:
    external: true
